<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siang Sore - Digital Order System</title>
    
    <!-- Tailwind CSS (Gunakan versi play untuk stabilitas penuh tanpa dependensi) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Pustaka Ikon FontAwesome (Lebih bersahabat dengan Github Pages dibanding Lucide) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-900">

    <!-- 1. HALAMAN LOGIN (MUNCUL PERTAMA KALI) -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[2.5rem] p-6 md:p-10 shadow-2xl border border-slate-100">
            <div class="text-center mb-10">
                <div class="bg-red-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-6 text-white text-2xl">
                    <i class="fa-solid fa-utensils"></i>
                </div>
                <h1 class="text-2xl font-black text-slate-800 tracking-tight">SIANG SORE</h1>
                <p class="text-slate-400 font-medium text-sm mt-1 uppercase tracking-widest text-center">Digital Order System</p>
            </div>
            <form id="login-form" class="space-y-5">
                <div class="space-y-1.5">
                    <label class="text-[10px] font-black text-slate-400 uppercase ml-2 tracking-widest">Nama Pelanggan</label>
                    <div class="relative">
                        <div class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-300"><i class="fa-solid fa-user"></i></div>
                        <input required type="text" id="cust-name" class="w-full bg-slate-50 border border-slate-200 rounded-xl py-3.5 pl-12 pr-4 focus:ring-2 focus:ring-red-500/20 outline-none font-semibold" placeholder="Nama Anda">
                    </div>
                </div>
                <div class="space-y-1.5">
                    <label class="text-[10px] font-black text-slate-400 uppercase ml-2 tracking-widest">Nomor Meja</label>
                    <div class="relative">
                        <div class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-300"><i class="fa-solid fa-hashtag"></i></div>
                        <input required type="number" id="cust-table" class="w-full bg-slate-50 border border-slate-200 rounded-xl py-3.5 pl-12 pr-4 focus:ring-2 focus:ring-red-500/20 outline-none font-semibold" placeholder="00">
                    </div>
                </div>
                <button type="submit" class="w-full bg-red-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-red-700 shadow-lg shadow-red-100 transition-all">Lihat Menu</button>
            </form>
        </div>
    </div>

    <!-- 2. UTAMA / DASHBOARD MENU (DISEMBUNYIKAN SECARA DEFAULT) -->
    <div id="main-screen" class="hidden min-h-screen bg-white">
        <!-- Header -->
        <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-slate-100 px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-red-600 text-white p-2.5 rounded-lg text-sm"><i class="fa-solid fa-utensils"></i></div>
                <div>
                    <h1 class="text-xl font-black tracking-tight italic leading-none">SIANG SORE</h1>
                    <p id="header-user-info" class="text-[9px] font-bold text-slate-400 uppercase mt-1 tracking-tighter">Table 00 • Guest</p>
                </div>
            </div>
            <div class="bg-green-50 px-3 py-1.5 rounded-full border border-green-100 flex items-center gap-2">
                <span class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span>
                <span class="text-[9px] font-black text-green-700 uppercase">Online</span>
            </div>
        </header>

        <!-- Navigasi Kategori -->
        <div class="sticky top-[73px] z-30 bg-white border-b border-slate-50 overflow-x-auto py-3 px-6">
            <div class="flex gap-2 min-w-max" id="category-tabs">
                <!-- Diisi otomatis oleh JavaScript -->
            </div>
        </div>

        <!-- Grid Menu Produk -->
        <main class="p-6 pb-32 max-w-7xl mx-auto">
            <div id="menu-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                <!-- Diisi otomatis oleh JavaScript -->
            </div>
        </main>

        <!-- Floating Bar Keranjang Belanja -->
        <div id="floating-cart" class="hidden fixed bottom-8 left-1/2 -translate-x-1/2 z-50 flex flex-col items-center gap-3 w-full max-w-[320px]">
            <!-- Detail Keranjang (Popup Mini Cart) -->
            <div id="mini-cart" class="hidden bg-white w-full rounded-[2rem] shadow-2xl border border-slate-100 p-5 mb-2">
                <div class="flex items-center justify-between mb-4 border-b border-slate-50 pb-2">
                    <h4 class="text-[10px] font-black uppercase text-slate-400 tracking-widest">Detail Pesanan Anda</h4>
                    <button onclick="toggleMiniCart()" class="bg-slate-100 p-1.5 rounded-full text-xs w-6 h-6 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div id="cart-items-list" class="max-h-52 overflow-y-auto space-y-4 mb-4 pr-1">
                    <!-- Item keranjang diisi di sini -->
                </div>
                <div class="flex justify-between items-center pt-3 border-t border-slate-100">
                    <span class="text-xs font-bold text-slate-400">Estimasi Total</span>
                    <span id="popup-total-price" class="text-lg font-black text-red-600 underline decoration-red-200">Rp 0</span>
                </div>
            </div>
            <!-- Tombol Utama Pemicu Keranjang -->
            <button onclick="handleCartButtonClick()" class="w-full bg-slate-900 text-white rounded-full py-5 px-8 flex items-center justify-between shadow-2xl shadow-slate-400 active:scale-95 transition-all group">
                <div class="flex items-center gap-3">
                    <div class="bg-red-600 p-2 rounded-lg text-xs"><i class="fa-solid fa-bag-shopping"></i></div>
                    <span id="cart-count-badge" class="text-xs font-bold">0 Item</span>
                </div>
                <div class="flex items-center gap-2">
                    <span id="cart-total-price" class="text-sm font-black">Rp 0</span>
                    <i class="fa-solid fa-chevron-right text-xs transition-transform group-hover:translate-x-1"></i>
                </div>
            </button>
        </div>
    </div>

    <!-- 3. MODAL KUSTOMISASI ADDONS (DISEMBUNYIKAN) -->
    <div id="addon-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end md:items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-[2rem] overflow-hidden shadow-2xl animate-in slide-in-from-bottom duration-200">
            <div class="p-6 flex items-center justify-between bg-slate-50 border-b border-slate-100">
                <div>
                    <h3 id="addon-modal-title" class="font-black text-slate-800 leading-none">Nama Makanan</h3>
                    <span class="text-[9px] font-bold text-slate-400 uppercase mt-1 inline-block tracking-widest">Kustomisasi Menu</span>
                </div>
                <button onclick="closeAddonModal()" class="p-2 bg-white rounded-full border border-slate-100 w-8 h-8 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <div id="addons-list" class="space-y-2">
                    <!-- List Addons dinamis -->
                </div>
            </div>
            <div class="p-6 pt-0">
                <button onclick="commitAddToCart()" class="w-full bg-red-600 text-white py-4 rounded-xl font-bold text-sm shadow-lg shadow-red-100">Masukan Keranjang</button>
            </div>
        </div>
    </div>

    <!-- 4. MODAL CHECKOUT / PEMBAYARAN (DISEMBUNYIKAN) -->
    <div id="checkout-modal" class="hidden fixed inset-0 bg-slate-900/80 backdrop-blur-md z-[60] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[3rem] overflow-hidden shadow-2xl" id="checkout-modal-content">
            <!-- Isi Konten Checkout (Metode Bayar / Nota Sukses) dikontrol oleh JS -->
        </div>
    </div>

    <!-- LOGIKAL SISTEM APLIKASI UTAMA (VANILLA JAVASCRIPT) -->
    <script>
        // Data Statis Aplikasi
        const MENU_DATA = [
          {
            id: 'p1', category: 'Paket Nasi',
            items: [
              { id: 'pn1', name: 'Paket Sutan Rendang', price: 45000, desc: 'Nasi, Rendang Daging, Daun Singkong, Sambal Ijo', image: 'https://images.unsplash.com/photo-1606491956689-2ea84b725c81?w=400&h=300&fit=crop', cal: 650, type: 'food' },
              { id: 'pn2', name: 'Paket Rancak Ayam Pop', price: 42000, desc: 'Nasi, Ayam Pop Spesial, Kuah Gulai, Sambal Merah', image: 'https://images.unsplash.com/photo-1598515214211-89d3c73ae83b?w=400&h=300&fit=crop', cal: 580, type: 'food' }
            ]
          },
          {
            id: 'p2', category: 'Lauk Utama',
            items: [
              { id: 'l1', name: 'Rendang Daging', price: 25000, desc: 'Daging sapi pilihan dengan bumbu otentik', image: 'https://images.unsplash.com/photo-1626500155553-9092404b901a?w=400&h=300&fit=crop', cal: 320, type: 'food' },
              { id: 'l2', name: 'Ayam Pop', price: 22000, desc: 'Ayam kampung gurih dengan saus tomat khas', image: 'https://images.unsplash.com/photo-1562967962-e2e141400f70?w=400&h=300&fit=crop', cal: 280, type: 'food' }
            ]
          },
          {
            id: 'p3', category: 'Minuman',
            items: [
              { id: 'm1', name: 'Teh Talua', price: 18000, desc: 'Minuman energi khas Minang dari telur ayam kampung', image: 'https://images.unsplash.com/photo-1556679343-c7306c1976bc?w=400&h=300&fit=crop', cal: 220, type: 'drink' },
              { id: 'm2', name: 'Es Jeruk Nipis', price: 12000, desc: 'Segar dan asam alami', image: 'https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=400&h=300&fit=crop', cal: 80, type: 'drink' }
            ]
          }
        ];

        const FOOD_ADDONS = [
          { id: 'fa1', name: 'Ekstra Sambal Ijo', price: 5000 },
          { id: 'fa2', name: 'Telur Dadar Barendo', price: 12000 },
          { id: 'fa3', name: 'Kerupuk Kulit Kuah', price: 15000 },
          { id: 'fa4', name: 'Nasi Tambah', price: 8000 }
        ];

        const DRINK_ADDONS = [
          { id: 'da1', name: 'Ekstra Es Batu', price: 2000 },
          { id: 'da2', name: 'Ekstra Gula/Susu', price: 3000 },
          { id: 'da3', name: 'Toping Cincau', price: 5000 }
        ];

        // State / Penyimpanan Data Sementara aplikasi
        let currentCustomer = { name: '', table: '' };
        let activeCategory = 'p1';
        let cart = [];
        let currentSelectedItem = null;
        let selectedAddonIds = [];
        let showMiniCartState = false;
        let selectedPaymentMethod = null;

        // Manajemen Login
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            currentCustomer.name = document.getElementById('cust-name').value;
            currentCustomer.table = document.getElementById('cust-table').value;
            
            document.getElementById('header-user-info').innerText = `Table ${currentCustomer.table} • ${currentCustomer.name}`;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-screen').classList.remove('hidden');
            
            initTabs();
            renderMenu();
        });

        // Merender Navigasi Kategori
        function initTabs() {
            const tabsContainer = document.getElementById('category-tabs');
            tabsContainer.innerHTML = '';
            MENU_DATA.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `px-6 py-2 rounded-full text-xs font-bold transition-all border ${activeCategory === cat.id ? 'bg-red-600 border-red-600 text-white shadow-md' : 'bg-white border-slate-200 text-slate-500 hover:border-slate-300'}`;
                btn.innerText = cat.category;
                btn.onclick = () => {
                    activeCategory = cat.id;
                    initTabs();
                    renderMenu();
                };
                tabsContainer.appendChild(btn);
            });
        }

        // Merender Daftar Menu Berdasarkan Kategori Aktif
        function renderMenu() {
            const grid = document.getElementById('menu-grid');
            grid.innerHTML = '';
            const activeData = MENU_DATA.find(c => c.id === activeCategory);
            
            activeData.items.forEach(item => {
                const card = document.createElement('div');
                card.className = "group bg-white border border-slate-100 rounded-2xl overflow-hidden hover:shadow-xl transition-all flex flex-col";
                card.innerHTML = `
                    <div class="h-44 overflow-hidden relative">
                        <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
                        <div class="absolute bottom-3 left-3 bg-slate-900/80 backdrop-blur px-2.5 py-1 rounded-lg flex items-center gap-1.5 text-white">
                            <i class="fa-solid fa-fire text-orange-400 text-[10px]"></i>
                            <span class="text-[10px] font-bold">${item.cal} Cal</span>
                        </div>
                    </div>
                    <div class="p-4 flex flex-col flex-1">
                        <div class="flex justify-between items-start gap-2 mb-1">
                            <h3 class="font-bold text-slate-800 text-sm leading-tight">${item.name}</h3>
                            <span class="text-xs font-black text-red-600">Rp${item.price.toLocaleString()}</span>
                        </div>
                        <p class="text-[10px] text-slate-400 mb-4 line-clamp-2">${item.desc}</p>
                        <button onclick="openAddonModal('${item.id}')" class="mt-auto w-full border border-slate-200 py-2.5 rounded-xl text-[11px] font-bold hover:bg-red-600 hover:text-white hover:border-red-600 transition-all flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-plus text-[10px]"></i> Tambah Ke Pesanan
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Membuka Dialog Addon Kustomisasi
        function openAddonModal(itemId) {
            let item = null;
            MENU_DATA.forEach(cat => {
                const found = cat.items.find(i => i.id === itemId);
                if(found) item = found;
            });
            
            currentSelectedItem = item;
            selectedAddonIds = [];
            
            document.getElementById('addon-modal-title').innerText = item.name;
            const addonsList = document.getElementById('addons-list');
            addonsList.innerHTML = '';
            
            const targetAddons = item.type === 'drink' ? DRINK_ADDONS : FOOD_ADDONS;
            targetAddons.forEach(addon => {
                const btn = document.createElement('button');
                btn.id = `addon-btn-${addon.id}`;
                btn.className = "w-full flex items-center justify-between p-4 rounded-xl border bg-white border-slate-100 hover:border-slate-300 transition-all text-slate-700";
                btn.innerHTML = `<span class="text-xs font-bold">${addon.name}</span><span class="text-[10px] font-black text-slate-400">+Rp${addon.price.toLocaleString()}</span>`;
                btn.onclick = () => toggleAddonSelection(addon.id);
                addonsList.appendChild(btn);
            });
            
            document.getElementById('addon-modal').classList.remove('hidden');
        }

        function toggleAddonSelection(addonId) {
            const index = selectedAddonIds.indexOf(addonId);
            const btn = document.getElementById(`addon-btn-${addonId}`);
            if (index > -1) {
                selectedAddonIds.splice(index, 1);
                btn.className = "w-full flex items-center justify-between p-4 rounded-xl border bg-white border-slate-100 hover:border-slate-300 transition-all text-slate-700";
            } else {
                selectedAddonIds.push(addonId);
                btn.className = "w-full flex items-center justify-between p-4 rounded-xl border transition-all bg-red-50 border-red-600 text-red-700";
            }
        }

        function closeAddonModal() {
            document.getElementById('addon-modal').classList.add('hidden');
        }

        // Menyimpan Item Ke Dalam Keranjang
        function commitAddToCart() {
            const targetAddons = currentSelectedItem.type === 'drink' ? DRINK_ADDONS : FOOD_ADDONS;
            const chosen = targetAddons.filter(a => selectedAddonIds.includes(a.id));
            
            let addonCost = chosen.reduce((sum, a) => sum + a.price, 0);
            
            const cartItem = {
                ...currentSelectedItem,
                cartId: Date.now(),
                selectedAddons: chosen,
                totalPrice: currentSelectedItem.price + addonCost
            };
            
            cart.push(cartItem);
            closeAddonModal();
            updateCartUI();
        }

        // Sinkronisasi Data Tampilan Keranjang Belanja
        function updateCartUI() {
            const floatingCart = document.getElementById('floating-cart');
            if (cart.length === 0) {
                floatingCart.classList.add('hidden');
                return;
            }
            
            floatingCart.classList.remove('hidden');
            document.getElementById('cart-count-badge').innerText = `${cart.length} Item`;
            
            let rawTotal = cart.reduce((sum, item) => sum + item.totalPrice, 0);
            let grandTotal = rawTotal * 1.1; // Pajak 10%
            
            document.getElementById('cart-total-price').innerText = `Rp ${grandTotal.toLocaleString()}`;
            document.getElementById('popup-total-price').innerText = `Rp ${grandTotal.toLocaleString()}`;
            
            // Render ulang list isi item popup keranjang
            const container = document.getElementById('cart-items-list');
            container.innerHTML = '';
            
            cart.forEach(item => {
                const row = document.createElement('div');
                row.className = "flex justify-between items-start group";
                
                let addonsHtml = item.selectedAddons.map(a => `<span class="text-[9px] text-red-500 font-bold block mt-0.5">• ${a.name}</span>`).join('');
                
                row.innerHTML = `
                    <div class="flex-1">
                        <p class="text-[11px] font-bold text-slate-800 leading-tight">${item.name}</p>
                        ${addonsHtml}
                    </div>
                    <div class="text-right flex flex-col items-end">
                        <span class="text-[11px] font-black">Rp${item.totalPrice.toLocaleString()}</span>
                        <button onclick="removeFromCart(${item.cartId})" class="text-slate-300 hover:text-red-500 mt-1"><i class="fa-solid fa-trash-can text-[10px]"></i></button>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        function removeFromCart(cartId) {
            cart = cart.filter(item => item.cartId !== cartId);
            updateCartUI();
            if(cart.length === 0) {
                showMiniCartState = false;
                document.getElementById('mini-cart').classList.add('hidden');
            }
        }

        function toggleMiniCart() {
            showMiniCartState = !showMiniCartState;
            const element = document.getElementById('mini-cart');
            if(showMiniCartState) {
                element.classList.remove('hidden');
            } else {
                element.classList.add('hidden');
            }
        }

        function handleCartButtonClick() {
            if (showMiniCartState) {
                openCheckoutModal();
            } else {
                toggleMiniCart();
            }
        }

        // Sesi Pembayaran / Checkout
        function openCheckoutModal() {
            selectedPaymentMethod = null;
            renderCheckoutView('gate');
            document.getElementById('checkout-modal').classList.remove('hidden');
        }

        function closeCheckoutModal() {
            document.getElementById('checkout-modal').classList.add('hidden');
        }

        function selectPayment(methodId) {
            selectedPaymentMethod = methodId;
            renderCheckoutView('gate');
        }

        function renderCheckoutView(view) {
            const content = document.getElementById('checkout-modal-content');
            let rawTotal = cart.reduce((sum, item) => sum + item.totalPrice, 0);
            let grandTotal = rawTotal * 1.1;

            if (view === 'gate') {
                content.innerHTML = `
                    <div class="p-8">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-xl font-black italic">Selesaikan Pembayaran</h3>
                            <button onclick="closeCheckoutModal()" class="text-slate-300 hover:text-slate-900 text-lg"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <div class="grid grid-cols-2 gap-3 mb-8">
                            <button onclick="selectPayment('qris')" class="p-4 rounded-xl border flex flex-col gap-2 transition-all ${selectedPaymentMethod === 'qris' ? 'border-red-600 bg-red-50 text-red-600 shadow-inner' : 'border-slate-100'}">
                                <i class="fa-solid fa-qrcode text-lg"></i>
                                <span class="text-[11px] font-black">QRIS</span>
                            </button>
                            <button onclick="selectPayment('cash')" class="p-4 rounded-xl border flex flex-col gap-2 transition-all ${selectedPaymentMethod === 'cash' ? 'border-red-600 bg-red-50 text-red-600 shadow-inner' : 'border-slate-100'}">
                                <i class="fa-solid fa-money-bill-wave text-lg"></i>
                                <span class="text-[11px] font-black">Tunai</span>
                            </button>
                        </div>
                        
                        ${selectedPaymentMethod === 'qris' ? `
                        <div class="mb-8 p-6 bg-slate-50 rounded-3xl flex flex-col items-center space-y-4 border border-slate-100">
                            <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-100">
                                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=SiangSore-Payment" alt="QR Payment" class="w-32 h-32">
                            </div>
                            <div class="text-center">
                                <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-1">Scan QRIS Siang Sore</p>
                                <p class="text-xs font-bold text-slate-600">Scan melalui aplikasi bank atau e-wallet</p>
                            </div>
                        </div>` : ''}

                        <div class="bg-slate-900 p-6 rounded-2xl mb-8">
                           <div class="flex justify-between items-center mb-2">
                             <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Total Tagihan</span>
                             <span class="text-xs font-bold text-white opacity-50 italic">(Tax 10% Incl.)</span>
                           </div>
                           <p class="text-3xl font-black text-red-500 tracking-tight">Rp ${grandTotal.toLocaleString()}</p>
                        </div>
                        <button ${!selectedPaymentMethod ? 'disabled' : ''} onclick="processOrder()" class="w-full bg-red-600 disabled:bg-slate-200 text-white py-5 rounded-xl font-black shadow-xl shadow-red-100 transition-all">
                            KONFIRMASI BAYAR
                        </button>
                    </div>
                `;
            } else if (view === 'success') {
                content.innerHTML = `
                    <div class="p-12 text-center space-y-6">
                        <div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl"><i class="fa-solid fa-circle-check"></i></div>
                        <h2 class="text-2xl font-black text-slate-900 leading-none">ORDER BERHASIL!</h2>
                        <div class="bg-slate-50 p-4 rounded-2xl text-[11px] font-mono text-left space-y-1">
                            <p>Order ID: #SS-${Math.floor(10000 + Math.random() * 90000)}</p>
                            <p>Meja: ${currentCustomer.table} | Pelanggan: ${currentCustomer.name}</p>
                        </div>
                        <button onclick="resetApp()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold">Menu Utama</button>
                    </div>
                `;
            }
        }

        function processOrder() {
            const btn = document.querySelector('#checkout-modal-content button:last-child');
            btn.disabled = true;
            btn.innerText = "MEMPROSES PESANAN...";
            
            setTimeout(() => {
                renderCheckoutView('success');
            }, 2000);
        }

        function resetApp() {
            cart = [];
            showMiniCartState = false;
            selectedPaymentMethod = null;
            document.getElementById('mini-cart').classList.add('hidden');
            closeCheckoutModal();
            updateCartUI();
        }
    </script>
</body>
</html>
